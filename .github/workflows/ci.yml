name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run Fern's unit tests
        run: ./gradlew --no-daemon build
      - name: Compile the smoke test and run the webhook signature test
        run: ./gradlew --no-daemon -p tests test installDist
      - name: Generated code matches the contract
        run: ./scripts/generate-check.sh
